<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DJ Dusty</title>
  <meta name="description" content="DJ Dusty music, mixes, and latest track.">
  <link rel="shortcut icon" href="../img/codeicon-mid.png">
  <link rel="apple-touch-icon" sizes="144x144" href="../img/favicon-retina-ipad.png">
  <link rel="apple-touch-icon" sizes="114x114" href="../img/favicon-retina-iphone.png">
  <link rel="apple-touch-icon" sizes="72x72" href="../img/favicon-standard-ipad.png">
  <link rel="apple-touch-icon" sizes="57x57" href="../img/favicon-standard-iphone.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <nav class="top-nav" aria-label="Primary navigation">
      <a href="../">Dustin Horning</a>
      <a href="https://soundcloud.com/dj_dustbuster" target="_blank" rel="noopener">SoundCloud</a>
    </nav>

    <section class="hero" aria-labelledby="page-title">
      <div class="logo-frame">
        <a href="https://soundcloud.com/dj_dustbuster" target="_blank" rel="noopener" aria-label="Open DJ Dusty on SoundCloud">
          <img src="assets/dj_dusty_transparent.png" alt="DJ Dusty">
        </a>
      </div>

      <div class="intro">
        <p class="eyebrow">DJ Dusty</p>
        <h1 id="page-title">House cuts, retro pulse, late-night motion.</h1>
        <p class="lede">New track in progress from the studio.</p>
      </div>
    </section>

    <section class="player-panel" aria-labelledby="track-title">
      <div>
        <p class="eyebrow">Latest Track</p>
        <h2 id="track-title">80s Opener</h2>
      </div>

      <audio controls preload="metadata">
        <source src="assets/80s_opener.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>

      <div class="actions">
        <a class="button primary" href="https://soundcloud.com/dj_dustbuster" target="_blank" rel="noopener">Listen on SoundCloud</a>
        <a class="button secondary" href="../">Back to main site</a>
      </div>
    </section>
  </main>
</body>
</html>
